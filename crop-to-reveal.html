<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crop to reveal</title>
<style>
  :root{--ink:#17131b;--panel:rgba(23,19,27,.82);--paper:#efe6d2;--gilt:#c9a24a;--gilt-hi:#f1d27c}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--paper);font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  canvas#scene{display:block;width:100vw;height:100vh;touch-action:none;outline:none}
  button{font:inherit;cursor:pointer;border:none;padding:0;background:none;color:var(--paper)}
  button:focus-visible{outline:2px solid var(--gilt-hi);outline-offset:3px}

  #bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);transition:opacity .4s}
  #bar.hidden{opacity:0;pointer-events:none}
  .go{width:60px;height:60px;border-radius:50%;background:var(--gilt);color:var(--ink);display:grid;place-items:center;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .go svg{width:30px;height:30px}
  .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gilt-hi);animation:ring 1.6s ease-out infinite;pointer-events:none}
  @keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}
  .icon{width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,162,74,.5);background:var(--panel);display:grid;place-items:center}
  .icon svg{width:22px;height:22px}
  #sound{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px}

  /* the crop you'll take home, drawn as a frame floating in the view */
  #frame{position:fixed;left:50%;top:50%;pointer-events:none;opacity:0;transition:opacity .5s, border-color .25s;
    border:2px solid rgba(241,210,124,.75);box-shadow:0 0 0 200vmax rgba(12,9,14,.22)}
  #frame.on{opacity:1}
  #frame::before,#frame::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--gilt-hi);transition:box-shadow .25s}
  #frame::before{left:-6px;top:-6px;border-right:none;border-bottom:none}
  #frame::after{right:-6px;bottom:-6px;border-left:none;border-top:none}
  #frame.aligned{border-color:var(--gilt-hi)}
  #frame.aligned::before,#frame.aligned::after{box-shadow:0 0 14px var(--gilt-hi)}

  .tap{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(255,248,230,.92);box-shadow:0 0 14px rgba(255,240,200,.9);pointer-events:none;display:none;animation:tapdot 2s ease-in-out infinite}
  .tap.on{display:block}
  .tap i{position:absolute;inset:0;border-radius:50%;border:2px solid #fff8e6;animation:tapring 2s ease-out infinite}
  @keyframes tapdot{0%,100%{transform:scale(1)}12%{transform:scale(.7)}26%{transform:scale(1)}}
  @keyframes tapring{0%,12%{transform:scale(1);opacity:0}14%{opacity:1}60%,100%{transform:scale(3.2);opacity:0}}
  #dragHint{position:fixed;left:50%;top:50%;width:170px;height:22px;margin:-11px 0 0 -85px;pointer-events:none;opacity:0;transition:opacity .5s}
  #dragHint.on{opacity:1}
  #dragHint::before{content:"";position:absolute;left:8px;right:8px;top:10px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,248,230,.75),transparent)}
  #dragHint .dot{position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;background:rgba(255,248,230,.92);box-shadow:0 0 14px rgba(255,240,200,.9);animation:slide 2.4s ease-in-out infinite}
  @keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(148px)}}

  #book{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,12,.72);opacity:0;pointer-events:none;transition:opacity .35s}
  #book.open{opacity:1;pointer-events:auto}
  #book canvas{width:min(94vw,980px);height:auto;transform:translateY(14px) rotate(-.6deg);transition:transform .35s;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
  #book.open canvas{transform:none}
  #bookClose{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px}

  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#14110f;transition:opacity .6s}
  #loading.done{opacity:0;pointer-events:none}
  .spin{width:46px;height:46px;border:3px solid rgba(201,162,74,.25);border-top-color:var(--gilt-hi);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .pulse::after{animation:none} #book,#book canvas,#bar{transition:none} }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="A gallery with a painting you can step into and reframe"></canvas>
<div id="frame" aria-hidden="true"></div>
<button id="sound" class="icon" aria-label="Sound" aria-pressed="true"></button>
<div id="tapHint" class="tap" aria-hidden="true"><i></i></div>
<div id="dragHint" aria-hidden="true"><span class="dot"></span></div>
<div id="bar" class="hidden"><button id="pbtn" class="go" aria-label="Step inside"></button></div>
<div id="book" aria-hidden="true">
  <button id="bookClose" class="icon" aria-label="Close sketchbook"></button>
  <canvas id="bookView" width="1200" height="600" aria-label="The artist's sketchbook"></canvas>
</div>
<div id="loading"><span class="spin"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
setTimeout(() => {
const V3=THREE.Vector3;
const W=4, H=3, CY=2.2;                       // canvas on the wall
const C0=new V3(0,CY,5);                       // the painter's eye: where the canvas exactly fills its own crop
const HW=Math.atan((W/2)/5), HH=Math.atan((H/2)/5);   // half-angles of the crop
const GALLERY_POS=new V3(0,1.7,9.5), GALLERY_LOOK=new V3(0,2.0,0);
const BOOK_POS=new V3(1.0,1.1,5.4);
const TOL=4;                                   // degrees of forgiveness when lining up a figure
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, linear=t=>t;
const wrapDeg=d=>((d+540)%360+360)%360-180;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(5), R=(a,b)=>a+(b-a)*rnd();

// ---------- icons ----------
const ln=b=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const ICON={
  enter:ln('<rect x="2.5" y="3.5" width="19" height="17" rx="1"/><rect x="8.5" y="8.5" width="7" height="7"/><path d="M2.5 3.5l6 5M21.5 3.5l-6 5M2.5 20.5l6-5M21.5 20.5l-6-5"/>'),
  exit:ln('<rect x="2.5" y="2.5" width="13" height="13" rx="1"/><path d="M9 9l12 12M21 14.5V21h-6.5"/>'),
  soundOn:ln('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9c1.4 1.6 1.4 4.4 0 6M19 6.5c2.8 3 2.8 8 0 11"/>'),
  soundOff:ln('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>'),
  close:ln('<path d="M6 6l12 12M18 6L6 18"/>'),
};

// ---------- the hidden figures (defined once, used for painting, sketchbook and gold trace) ----------
function ell(c,r,fill){ const pts=[]; for(let i=0;i<48;i++){ const a=i/48*Math.PI*2; pts.push([c[0]+Math.cos(a)*r[0],c[1]+Math.sin(a)*r[1]]); } return {pts,fill}; }
const poly=(pts,fill)=>({pts,fill});
const fishBody=(()=>{ const up=[],dn=[]; for(let i=0;i<=40;i++){ const t=i/40,x=-13+22*t,h=5.6*Math.pow(Math.sin(Math.PI*t),.75)*(1-.25*t); up.push([x,h]); dn.unshift([x,-h]); } return up.concat(dn); })();
const FIG={
  face:{psi:-90,p:6,notes:[392,523.25,659.25],shapes:[ell([0,1],[12,14],false),ell([-5,5],[2.6,1.7],true),ell([5,5],[2.6,1.7],true),poly([[0,4],[-2.2,-3],[2.2,-3]],false),ell([0,-7],[4.5,1.2],true)]},
  bird:{psi:145,p:16,notes:[523.25,659.25,880],shapes:[poly([[-16.10,4.14],[-11.50,6.44],[-6.90,6.21],[-2.88,1.84],[0.00,0.92],[2.88,1.84],[6.90,6.21],[11.50,6.44],[16.10,4.14],[11.50,4.60],[7.47,3.68],[3.45,-0.92],[1.61,-2.76],[1.15,-5.29],[0.00,-6.44],[-1.15,-5.29],[-1.61,-2.76],[-3.45,-0.92],[-7.47,3.68],[-11.50,4.60]],true)]},
  fish:{psi:58,p:-3,notes:[349.23,440,587.33],shapes:[poly(fishBody,true),poly([[10,0],[15.8,4.4],[14.2,0],[15.8,-4.4]],true),Object.assign(ell([-8,1.1],[1.1,1.1],true),{hole:true})]},
};
const ORDER=['face','bird','fish'];
const found={face:false,bird:false,fish:false};

// ---------- renderer ----------
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color('#14110f');
const camera=new THREE.PerspectiveCamera(50,1,.05,400); camera.position.copy(GALLERY_POS);
const lookTarget=GALLERY_LOOK.clone();
let galleryFov=50, insideFov=75;
function fitCamera(){
  renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight;
  galleryFov=camera.aspect<.8?62:50;
  // inside, widen the view so the crop frame always fits with room to spare
  const need=Math.max(Math.tan(HH)/.72,Math.tan(HW)/(camera.aspect*.8));
  insideFov=Math.max(75,deg(2*Math.atan(need)));
  if(state==='inside') camera.fov=insideFov; else if(state==='gallery') camera.fov=galleryFov;
  camera.updateProjectionMatrix();
}
let state='gallery';
fitCamera(); addEventListener('resize',fitCamera);

// ---------- painting the 360° world ----------
const PW=4096, PH=2048;
const X=ps=>(ps/360+.5)*PW, Y=p=>(.5-p/180)*PH, D=d=>d*PW/360;
function brushify(ctx,cw,ch,o){
  const data=ctx.getImageData(0,0,cw,ch).data, n=Math.floor(cw*ch/(o.len*o.width)*(o.density||1));
  ctx.save(); ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const x=rnd()*cw,y=rnd()*ch,id=((y|0)*cw+(x|0))*4; if(data[id+3]<40) continue;
    const j=(rnd()-.5)*o.jitter,k=o.jitter*.5;
    ctx.globalAlpha=.3+rnd()*.4;
    ctx.strokeStyle=`rgb(${clamp(data[id]+j+(rnd()-.5)*k,0,255)|0},${clamp(data[id+1]+j+(rnd()-.5)*k,0,255)|0},${clamp(data[id+2]+j+(rnd()-.5)*k,0,255)|0})`;
    ctx.lineWidth=o.width*(.5+rnd()); const a=(o.angle||0)+(rnd()-.5)*(o.angleVar??.6),l=o.len*(.5+rnd()),dx=Math.cos(a)*l/2,dy=Math.sin(a)*l/2;
    ctx.beginPath(); ctx.moveTo(x-dx,y-dy); ctx.quadraticCurveTo(x+(rnd()-.5)*l*.35,y+(rnd()-.5)*l*.35,x+dx,y+dy); ctx.stroke();
  }
  ctx.restore();
}
function shapePath(ctx,fig,sh,mapX,mapY){ ctx.beginPath(); sh.pts.forEach(([a,b],i)=>{ const x=mapX(fig.psi+a),y=mapY(fig.p+b); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath(); }
function wrapX(ctx,fn){ for(const off of [-PW,0,PW]){ ctx.save(); ctx.translate(off,0); fn(); ctx.restore(); } }

function paintPanorama(){
  const cv=document.createElement('canvas'); cv.width=PW; cv.height=PH; const ctx=cv.getContext('2d');
  // sky
  let g=ctx.createLinearGradient(0,Y(90),0,Y(0));
  [[0,'#22446b'],[.35,'#4c7cab'],[.72,'#9cc0d6'],[.93,'#dce4d4'],[1,'#f2dfb4']].forEach(s=>g.addColorStop(...s));
  ctx.fillStyle=g; ctx.fillRect(0,0,PW,Y(0)+4);
  const sg=ctx.createRadialGradient(X(-25),Y(32),0,X(-25),Y(32),D(26)); sg.addColorStop(0,'rgba(255,248,220,.95)'); sg.addColorStop(.12,'rgba(255,240,200,.6)'); sg.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,PW,Y(0));
  // clouds, kept away from the bird's patch of sky
  for(let i=0;i<30;i++){
    const cps=R(-180,180), cp=R(10,46); if(cps>112&&cps<178) continue;
    const s=R(2.5,6), st=1/Math.cos(rad(cp));
    wrapX(ctx,()=>{ for(let k=0;k<12;k++){ const px=cps+(rnd()-.5)*s*2.4*st,py=cp+(rnd()-.3)*s*.45,r=s*R(.35,.75);
        ctx.fillStyle='#f6f1e7'; ctx.beginPath(); ctx.ellipse(X(px),Y(py),D(r*1.3*st),D(r*.75),0,0,7); ctx.fill(); }
      ctx.fillStyle='rgba(172,182,204,.5)'; ctx.beginPath(); ctx.ellipse(X(cps),Y(cp-s*.3),D(s*.9*st),D(s*.2),0,0,7); ctx.fill(); });
  }
  // mountains all the way round
  const mtn=ps=>{const r=rad(ps);return Math.max(.8,3+2.5*Math.sin(3*r+1)+1.8*Math.sin(7*r+2)+.9*Math.sin(13*r));};
  const mPath=()=>{ ctx.beginPath(); ctx.moveTo(X(-180),Y(-1)); for(let ps=-180;ps<=180;ps+=.25) ctx.lineTo(X(ps),Y(mtn(ps))); ctx.lineTo(X(180),Y(-1)); ctx.closePath(); };
  mPath(); g=ctx.createLinearGradient(0,Y(9),0,Y(0)); g.addColorStop(0,'#8e9cc4'); g.addColorStop(1,'#c3c3d3'); ctx.fillStyle=g; ctx.fill();
  ctx.save(); mPath(); ctx.clip(); ctx.beginPath(); ctx.moveTo(0,0); for(let ps=-180;ps<=180;ps+=.5) ctx.lineTo(X(ps),Y(6.2+.5*Math.sin(ps*.9))); ctx.lineTo(PW,0); ctx.closePath(); ctx.fillStyle='#eeeaf2'; ctx.fill(); ctx.restore();
  // meadow
  g=ctx.createLinearGradient(0,Y(0),0,Y(-75)); g.addColorStop(0,'#9cb666'); g.addColorStop(.4,'#6f9a44'); g.addColorStop(1,'#35592b');
  ctx.fillStyle=g; ctx.fillRect(0,Y(0),PW,PH-Y(0));
  for(let ps=-180;ps<180;ps+=R(.6,1.4)){ if(ps>-54&&ps<100) continue; ctx.fillStyle=rnd()<.5?'#55783f':'#4a6c3a'; ctx.beginPath(); ctx.ellipse(X(ps),Y(.3),D(R(.6,1.2)),D(R(.4,1)),0,0,7); ctx.fill(); }

  // lake
  const L0=-52,L1=98,top=-.7;
  const bot=ps=>{ const t=clamp((ps-L0)/(L1-L0),0,1); return top+(-24+4*Math.sin(ps*.05)-top)*Math.sqrt(Math.sin(Math.PI*t)); };
  const lakePath=()=>{ ctx.beginPath(); ctx.moveTo(X(L0),Y(top)); ctx.lineTo(X(L1),Y(top)); for(let ps=L1;ps>=L0;ps-=.5) ctx.lineTo(X(ps),Y(bot(ps))); ctx.closePath(); };
  lakePath(); g=ctx.createLinearGradient(0,Y(top),0,Y(-26)); g.addColorStop(0,'#bfd4da'); g.addColorStop(1,'#3b6b87'); ctx.fillStyle=g; ctx.fill();
  ctx.save(); lakePath(); ctx.clip();
  ctx.beginPath(); ctx.moveTo(X(L0),Y(top)); for(let ps=L0;ps<=L1;ps+=.25) ctx.lineTo(X(ps),Y(top-(mtn(ps)-top)*.7)); ctx.lineTo(X(L1),Y(top)); ctx.closePath(); ctx.fillStyle='rgba(150,158,198,.42)'; ctx.fill();
  for(let i=0;i<500;i++){ const ps=R(L0,L1),p=R(-25,top); ctx.strokeStyle=`rgba(235,244,248,${R(.08,.3)})`; ctx.lineWidth=R(1,3); ctx.beginPath(); ctx.moveTo(X(ps),Y(p)); ctx.lineTo(X(ps+R(.8,3)),Y(p)); ctx.stroke(); }
  ctx.restore();
  // islands: decoys, then the fish
  function island(ps,wl,w,h,col,refl,jag){
    const up=[]; for(let i=0;i<=30;i++){ const t=i/30; let hh=h*Math.pow(Math.sin(Math.PI*t),.8); if(jag) hh*=1+.25*Math.sin(t*23); up.push([ps-w/2+w*t,hh]); }
    ctx.fillStyle=col; ctx.beginPath(); up.forEach(([a,b],i)=>i?ctx.lineTo(X(a),Y(wl+b)):ctx.moveTo(X(a),Y(wl+b))); ctx.closePath(); ctx.fill();
    ctx.fillStyle=refl; ctx.beginPath(); up.forEach(([a,b],i)=>i?ctx.lineTo(X(a),Y(wl-b*.9)):ctx.moveTo(X(a),Y(wl-b*.9))); ctx.closePath(); ctx.fill();
  }
  island(12,-1.6,9,2,'#3a6332','rgba(44,78,80,.8)'); island(-28,-2.2,12,3,'#6b6e5c','rgba(60,72,80,.75)',true);
  island(90,-2.6,7,4.5,'#33592e','rgba(40,72,76,.8)'); island(30,-6,3,1.2,'#77735f','rgba(64,76,82,.7)',true);
  const fish=FIG.fish;
  const sp=(sh,col)=>{ shapePath(ctx,fish,sh,X,Y); ctx.fillStyle=col; ctx.fill(); };
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,PW,Y(fish.p)); ctx.clip(); sp(fish.shapes[0],'#2f5a2c'); sp(fish.shapes[1],'#5d6a55');
  for(let i=0;i<26;i++){ const t=R(.05,.95),a=-13+22*t,h=5.6*Math.pow(Math.sin(Math.PI*t),.75)*(1-.25*t); ctx.fillStyle='#2f5a2c'; ctx.beginPath(); ctx.arc(X(fish.psi+a),Y(fish.p+h-.15),D(R(.35,.6)),0,7); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0,Y(fish.p),PW,PH); ctx.clip(); sp(fish.shapes[0],'#2b4c4e'); sp(fish.shapes[1],'#3d5054');
  for(let i=0;i<40;i++){ const ps=fish.psi+R(-13,16),p=fish.p-R(.3,5); ctx.strokeStyle='rgba(190,215,225,.22)'; ctx.lineWidth=R(1,2.5); ctx.beginPath(); ctx.moveTo(X(ps),Y(p)); ctx.lineTo(X(ps+R(.5,2)),Y(p)); ctx.stroke(); }
  ctx.restore();
  const ex=fish.psi-8, ey=fish.p;
  ctx.fillStyle='#f7f2e4'; ctx.beginPath(); ctx.moveTo(X(ex-.8),Y(ey+.15)); ctx.lineTo(X(ex+.1),Y(ey+2.5)); ctx.lineTo(X(ex+.9),Y(ey+.15)); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#6b4a33'; ctx.fillRect(X(ex-1.1),Y(ey+.2),D(2.2),D(.35));
  ctx.fillStyle='rgba(247,242,228,.35)'; ctx.beginPath(); ctx.moveTo(X(ex-.8),Y(ey-.2)); ctx.lineTo(X(ex+.1),Y(ey-2.2)); ctx.lineTo(X(ex+.9),Y(ey-.2)); ctx.closePath(); ctx.fill();

  // cliff with a face hidden among its caves
  const face=FIG.face, C0p=-138, C1p=-54;
  const ctop=ps=>{ const t=clamp((ps-C0p)/(C1p-C0p),0,1); return -12+(28+12)*Math.pow(Math.sin(Math.PI*t),.55)+2*Math.sin(ps*.4)+1.2*Math.sin(ps*1.1); };
  const cliffPath=()=>{ ctx.beginPath(); ctx.moveTo(X(C0p),Y(-14)); for(let ps=C0p;ps<=C1p;ps+=.3) ctx.lineTo(X(ps),Y(ctop(ps))); ctx.lineTo(X(C1p),Y(-14)); ctx.closePath(); };
  cliffPath(); g=ctx.createLinearGradient(0,Y(30),0,Y(-14)); g.addColorStop(0,'#a8978a'); g.addColorStop(1,'#6c5e50'); ctx.fillStyle=g; ctx.fill();
  ctx.save(); cliffPath(); ctx.clip();
  for(let p=-12;p<30;p+=R(1.8,3.2)){ ctx.strokeStyle='rgba(70,58,48,.28)'; ctx.lineWidth=R(2,4); ctx.beginPath(); for(let ps=C0p;ps<=C1p;ps+=1) ctx.lineTo(X(ps),Y(p+.6*Math.sin(ps*.3+p))); ctx.stroke(); }
  for(let i=0;i<40;i++){ const ps=R(C0p,C1p); ctx.strokeStyle='rgba(55,45,38,.35)'; ctx.lineWidth=R(1.5,3); ctx.beginPath(); let p=R(-10,25); ctx.moveTo(X(ps),Y(p)); for(let k=0;k<5;k++){ p-=R(1,2.5); ctx.lineTo(X(ps+R(-.6,.6)),Y(p)); } ctx.stroke(); }
  const inFace=(a,b)=>Math.pow((a-face.psi)/15,2)+Math.pow((b-face.p-1)/17,2)<1;
  const decoys=[[-125,4],[-118,15],[-112,-4],[-70,14],[-66,2],[-62,-6],[-110,22],[-74,-2],[-128,-6],[-60,10]];
  for(const [a,b] of decoys){ if(inFace(a,b)) continue; ctx.fillStyle='#2e2620'; ctx.beginPath(); ctx.ellipse(X(a),Y(b),D(R(1.4,2.6)),D(R(1,1.8)),R(-.3,.3),0,7); ctx.fill();
    ctx.strokeStyle='rgba(200,185,160,.4)'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(X(a),Y(b+.4),D(2.4),D(1.4),0,Math.PI*1.1,Math.PI*1.9); ctx.stroke(); }
  for(let i=0;i<30;i++){ const ps=R(C0p+4,C1p-4),p=R(-8,24); if(inFace(ps,p)) continue; ctx.fillStyle=`rgba(${rnd()<.5?'96,128,70':'120,140,80'},.55)`; ctx.beginPath(); ctx.ellipse(X(ps),Y(p),D(R(1,3)),D(R(.3,.7)),0,0,7); ctx.fill(); }
  // the face itself: a faint ring of cracks, caves for eyes, a ridge for a nose, a dark mouth pouring a waterfall

}
async function exitPainting(){
  if(state!=='inside') return; state='transition'; showBar(null);
  const hit=nearestFig(yaw,pitch,TOL);
  const target=hit?{psi:FIG[hit].psi,p:FIG[hit].p}:{psi:yaw,p:pitch};
  const y0=yaw,p0=pitch,dy=wrapDeg(target.psi-y0);
  await tween(.35,e=>{ yaw=y0+dy*e; pitch=lerp(p0,target.p,e); });
  frameEl.classList.remove('on','aligned');
  await tween(.9,e=>{ camera.fov=lerp(insideFov,galleryFov,e); camera.updateProjectionMatrix(); });
  crop={psi:wrapDeg(target.psi),p:target.p};
  camMode='look'; lookTarget.set(0,CY,0); sphere.quaternion.copy(qFor(crop.psi,crop.p)).invert();
  renderCrop(crop.psi,crop.p); canvasMesh.visible=true;
  whoosh(2.8,false);
  gallery.visible=true;
  await tween(1.0,e=>setGalleryOpacity(e),linear);
  sphere.visible=false;
  const thr=new V3(0,CY,0);
  await tween(1.6,e=>{ camera.position.lerpVectors(C0,GALLERY_POS,e); lookTarget.lerpVectors(thr,GALLERY_LOOK,e); });
  state='gallery'; galleryOffset.set(0,0); showBar('gallery');
  if(hit) reward(hit);
}
function nearestFig(ps,p,tol){ for(const k of ORDER){ const f=FIG[k]; if(Math.abs(wrapDeg(ps-f.psi))<tol&&Math.abs(p-f.p)<tol) return k; } return null; }

// ---------- reward: gold trace, a mote flies to the sketchbook, the page fills ----------
const moteTex=texCanvas(64,64,(ctx,S)=>{ const g=ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2); g.addColorStop(0,'rgba(255,255,240,1)'); g.addColorStop(.3,'rgba(255,220,130,.9)'); g.addColorStop(1,'rgba(255,220,130,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,S,S); });
const mote=new THREE.Sprite(new THREE.SpriteMaterial({map:moteTex,transparent:true,depthTest:false,blending:THREE.AdditiveBlending})); mote.renderOrder=1100; mote.visible=false; scene.add(mote);
const burst=new THREE.Sprite(new THREE.SpriteMaterial({map:moteTex,transparent:true,depthTest:false,blending:THREE.AdditiveBlending})); burst.renderOrder=1100; burst.visible=false; scene.add(burst);
function drawTrace(k,prog,alpha){
  const ctx=traceCv.getContext('2d'); ctx.clearRect(0,0,RT_W,RT_H); if(alpha<=0){ traceTex.needsUpdate=true; return; }
  ctx.globalAlpha=alpha; ctx.strokeStyle='#f6d77e'; ctx.lineWidth=7; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.shadowColor='rgba(255,215,120,.95)'; ctx.shadowBlur=18;
  for(const sh of FIG[k].shapes){ const pts=projectFig(FIG[k],sh).map(([u,v])=>[u*RT_W,v*RT_H]); let len=0; for(let i=0;i<pts.length;i++){ const a=pts[i],b=pts[(i+1)%pts.length]; len+=Math.hypot(b[0]-a[0],b[1]-a[1]); }
    ctx.setLineDash([len*prog,len+1]); ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.stroke(); }
  traceTex.needsUpdate=true;
}
let rewarding=false;
async function reward(k){
  rewarding=true; const isNew=!found[k];
  chime(FIG[k].notes,.22,.07);
  await tween(1.6,e=>drawTrace(k,e,1),linear);
  if(isNew){
    captureThumb(k);
    const a=new V3(0,CY,.1), b=new V3(BOOK_POS.x,1.25,BOOK_POS.z), c=new V3(.8,CY+1.4,2.6);
    mote.visible=true;
    await tween(1.3,e=>{ const u=1-e; mote.position.set(u*u*a.x+2*u*e*c.x+e*e*b.x,u*u*a.y+2*u*e*c.y+e*e*b.y,u*u*a.z+2*u*e*c.z+e*e*b.z); mote.scale.setScalar(lerp(.45,.25,e)); });
    mote.visible=false; found[k]=true; drawBook(); tick();
    burst.visible=true; burst.position.copy(b);
    tween(.8,e=>{ burst.scale.setScalar(lerp(.2,1.4,e)); burst.material.opacity=1-e; },linear).then(()=>burst.visible=false);
    if(ORDER.every(q=>found[q])){ await wait(.5); chime([523.25,659.25,783.99,1046.5,1318.5],.14,.08); burst.visible=true;
      tween(1.4,e=>{ burst.scale.setScalar(lerp(.3,2.6,e)); burst.material.opacity=1-e; },linear).then(()=>burst.visible=false); }
  } else await wait(.6);
  await tween(1.0,e=>drawTrace(k,1,1-e),linear);
  rewarding=false;
}

// ---------- input ----------
const keys=new Set();
addEventListener('keydown',e=>{ keys.add(e.key.toLowerCase()); if(e.key==='Escape') closeBook(); });
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let dragging=false,lastX=0,lastY=0,moved=0,lastDragT=0;
const galleryOffset=new THREE.Vector2(),galleryOffsetTarget=new THREE.Vector2();
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
function setRay(cx,cy){ ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); raycaster.setFromCamera(ndc,camera); return raycaster.ray; }
function hitPainting(cx,cy){ const r=setRay(cx,cy); if(Math.abs(r.direction.z)<1e-5) return false; const t=-r.origin.z/r.direction.z; if(t<0) return false;
  const p=r.origin.clone().addScaledVector(r.direction,t); return Math.abs(p.x)<=W/2+.25&&Math.abs(p.y-CY)<=H/2+.25; }
function hitBook(cx,cy){ setRay(cx,cy); return raycaster.intersectObject(bookGroup,true).length>0; }
canvas.addEventListener('pointerdown',e=>{ dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  if(state==='gallery'){ galleryOffsetTarget.set(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1);
    canvas.style.cursor=(hitPainting(e.clientX,e.clientY)||hitBook(e.clientX,e.clientY))?'pointer':'default'; }
  if(!dragging) return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  if(state==='inside'){
    const fovV=camera.fov, fovH=deg(2*Math.atan(Math.tan(rad(fovV/2))*camera.aspect));
    yaw=wrapDeg(yaw-dx*fovH/innerWidth); pitch=clamp(pitch+dy*fovV/innerHeight,-45,50);
    lastDragT=now; if(moved>20) dragHintUntil=0;
  }
});
canvas.addEventListener('pointerup',e=>{ if(!dragging) return; dragging=false; if(moved>=10||state!=='gallery'||rewarding) return;
  if(hitBook(e.clientX,e.clientY)){ ensureAudio(); openBook(); } else if(hitPainting(e.clientX,e.clientY)){ ensureAudio(); enterPainting(); } });
canvas.addEventListener('pointercancel',()=>dragging=false);

// ---------- overlays ----------
const projV=new V3();
function toScreen(v){ projV.copy(v).project(camera); if(projV.z>1) return null; return [(projV.x+1)/2*innerWidth,(1-projV.y)/2*innerHeight]; }
function updateOverlays(){
  if(state==='inside'||state==='transition'){
    const t=Math.tan(rad(camera.fov/2)), hh=Math.tan(HH)/t*innerHeight/2, hw=Math.tan(HW)/(t*camera.aspect)*innerWidth/2;
    frameEl.style.width=2*hw+'px'; frameEl.style.height=2*hh+'px'; frameEl.style.marginLeft=-hw+'px'; frameEl.style.marginTop=-hh+'px';
  }
  let target=null;
  if(state==='gallery'&&!rewarding&&!bookEl.classList.contains('open')){ if(!bookSeen) target=BOOK_POS.clone().setY(1.25); else if(!entered) target=new V3(.6,CY-.5,.05); }
  const tp=target&&toScreen(target); tapHint.classList.toggle('on',!!tp); if(tp){ tapHint.style.left=tp[0]+'px'; tapHint.style.top=tp[1]+'px'; }
  dragHint.classList.toggle('on',state==='inside'&&now<dragHintUntil);
}

// ---------- loop ----------
let last=performance.now()/1000, wasAligned=false;
function frame(){
  const t=performance.now()/1000,dt=Math.min(.05,t-last); last=t; now=t; runTweens();
  if(state==='gallery'){
    galleryOffset.lerp(galleryOffsetTarget,Math.min(1,dt*3));
    camera.position.set(GALLERY_POS.x+galleryOffset.x*.35,GALLERY_POS.y-galleryOffset.y*.15,GALLERY_POS.z); lookTarget.copy(GALLERY_LOOK);
  }
  if(state==='inside'){
    const sp=70*dt;
    if(keys.has('arrowleft')||keys.has('a')) yaw-=sp; if(keys.has('arrowright')||keys.has('d')) yaw+=sp;
    if(keys.has('arrowup')||keys.has('w')) pitch+=sp; if(keys.has('arrowdown')||keys.has('s')) pitch-=sp;
    yaw=wrapDeg(yaw); pitch=clamp(pitch,-45,50);
    // a gentle pull when a hidden figure is nearly framed
    const k=nearestFig(yaw,pitch,TOL), idle=!dragging&&keys.size===0&&now-lastDragT>.15;
    if(k&&idle){ const f=FIG[k],m=Math.min(1,dt*3.5); yaw=wrapDeg(yaw+wrapDeg(f.psi-yaw)*m); pitch+=(f.p-pitch)*m; }
    const aligned=!!k&&Math.abs(wrapDeg(FIG[k].psi-yaw))<.4&&Math.abs(FIG[k].p-pitch)<.4;
    if(aligned&&!wasAligned) tick(); wasAligned=aligned; frameEl.classList.toggle('aligned',aligned);
  }
  if(camMode==='look') camera.lookAt(lookTarget); else camera.quaternion.setFromEuler(euler.set(rad(pitch),-rad(yaw),0,'YXZ'));
  updateOverlays();
  renderer.render(scene,camera); requestAnimationFrame(frame);
}
renderCrop(crop.psi,crop.p); drawBook(); setGalleryOpacity(1); showBar('gallery');
requestAnimationFrame(frame);
document.getElementById('loading').classList.add('done');
}, 60);
</script>
</body>
